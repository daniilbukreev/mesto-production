<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesto</title>
  <script type="module" crossorigin src="./assets/index-CO5eXSjm.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-D2z4Cjqv.css">
</head>
<body>
  <div class="page">

    <header class="header">
      <div class="header__logo"></div>
    </header>

    <main class="content">
      <section class="profile">
        <div class="profile__avatar-container">
          <img class="profile__avatar" alt="Аватар">
          <button class="profile__avatar-edit" type="button"></button>
        </div>
        <div class="profile__info">
          <div class="profile__title-row">
            <h1 class="profile__title"></h1>
            <button class="profile__edit-button" type="button"></button>
          </div>
          <p class="profile__description"></p>
        </div>
        <button class="profile__add-button" type="button"></button>
      </section>

      <section class="places">
        <ul class="places__list"></ul>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__copyright">&copy; Mesto Russia</p>
    </footer>
  </div>

  <!-- ========== ШАБЛОН КАРТОЧКИ (с кнопкой "i") ========== -->
  <template id="card-template">
    <li class="card">
      <div class="card__image-container">
        <img class="card__image" alt="">
        <button class="card__delete-button" type="button"></button>
        <button class="card__control-button_type_info" type="button">i</button>
      </div>
      <div class="card__description">
        <h2 class="card__title"></h2>
        <div class="card__like-container">
          <button class="card__like-button" type="button"></button>
          <span class="card__like-count">0</span>
        </div>
      </div>
    </li>
  </template>

  <!-- ========== ШАБЛОНЫ ДЛЯ СТАТИСТИКИ (Вариант 1) ========== -->
  <template id="popup-info-definition-template">
    <div class="popup-info__definition">
      <dt class="popup-info__definition-term"></dt>
      <dd class="popup-info__definition-definition"></dd>
    </div>
  </template>

  <template id="popup-info-user-preview-template">
    <div class="popup-info__user-preview">
      <img class="popup-info__user-avatar" alt="Аватар">
      <span class="popup-info__user-name"></span>
    </div>
  </template>

  <!-- ========== МОДАЛЬНОЕ ОКНО СТАТИСТИКИ КАРТОЧКИ ========== -->
  <div class="popup popup_type_info">
    <div class="popup__container">
      <button class="popup__close" type="button"></button>
      <h2 class="popup__title">Статистика карточки</h2>
      <div class="popup__content popup__content_info">
        <dl class="popup-info__list"></dl>
        <div class="popup-info__users">
          <h3 class="popup-info__subtitle">Лайкнули:</h3>
          <div class="popup-info__users-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== МОДАЛЬНОЕ ОКНО РЕДАКТИРОВАНИЯ ПРОФИЛЯ ========== -->
  <div class="popup popup_type_edit">
    <div class="popup__container">
      <button class="popup__close" type="button"></button>
      <h2 class="popup__title">Редактировать профиль</h2>
      <form class="popup__form" name="edit-profile">
        <input type="text" class="popup__input popup__input_type_name" id="user-name" name="name" placeholder="Имя" required minlength="2" maxlength="40">
        <span class="popup__error user-name-error"></span>
        <input type="text" class="popup__input popup__input_type_description" id="user-description" name="about" placeholder="О себе" required minlength="2" maxlength="200">
        <span class="popup__error user-description-error"></span>
        <button class="popup__button" type="submit">Сохранить</button>
      </form>
    </div>
  </div>

  <!-- ========== МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ КАРТОЧКИ ========== -->
  <div class="popup popup_type_new-card">
    <div class="popup__container">
      <button class="popup__close" type="button"></button>
      <h2 class="popup__title">Новое место</h2>
      <form class="popup__form" name="new-place">
        <input type="text" class="popup__input popup__input_type_card-name" id="place-name" name="name" placeholder="Название" required minlength="2" maxlength="30">
        <span class="popup__error place-name-error"></span>
        <input type="url" class="popup__input popup__input_type_url" id="place-link" name="link" placeholder="Ссылка на картинку" required>
        <span class="popup__error place-link-error"></span>
        <button class="popup__button" type="submit">Создать</button>
      </form>
    </div>
  </div>

  <!-- ========== МОДАЛЬНОЕ ОКНО ПРОСМОТРА ИЗОБРАЖЕНИЯ ========== -->
  <div class="popup popup_type_image">
    <div class="popup__content popup__content_content_image">
      <img class="popup__image" alt="">
      <p class="popup__caption"></p>
      <button class="popup__close" type="button"></button>
    </div>
  </div>

  <!-- ========== МОДАЛЬНОЕ ОКНО ОБНОВЛЕНИЯ АВАТАРА ========== -->
  <div class="popup popup_type_avatar">
    <div class="popup__container">
      <button class="popup__close" type="button"></button>
      <h2 class="popup__title">Обновить аватар</h2>
      <form class="popup__form" name="edit-avatar">
        <input type="url" class="popup__input popup__input_type_url" id="user-avatar" name="avatar" placeholder="Ссылка на аватар" required>
        <span class="popup__error user-avatar-error"></span>
        <button class="popup__button" type="submit">Сохранить</button>
      </form>
    </div>
  </div>

</body>
</html>
